# Mosquitto 2.0. Every client must authenticate; ACLs bind each device to its own topics.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Keeps retained device status (online/offline LWT) across broker restarts. Commands are never retained.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Private listener for Core, reachable only on the internal compose network (not published).
listener 1883 0.0.0.0

# Device listener: TLS with the domain certificate copied from Caddy (scripts/sync-mqtt-cert.sh).
listener 8883 0.0.0.0
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
