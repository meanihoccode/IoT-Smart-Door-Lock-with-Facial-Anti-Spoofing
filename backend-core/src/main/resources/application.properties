# Server Port
server.port=8080

# Load configuration from both the shared .env file and optional local config.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:./config/application-local.properties

# MySQL Database Configuration
# SSL mode: PREFERRED for local dev; VERIFY_IDENTITY for a managed cloud DB reached over a network.
spring.datasource.url=jdbc:mysql://${SMARTLOCK_DB_HOST:${DB_HOST:localhost}}:${SMARTLOCK_DB_PORT:${DB_PORT:3306}}/${SMARTLOCK_DB_NAME:${DB_NAME:btl_iot}}?sslMode=${SMARTLOCK_DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&allowPublicKeyRetrieval=${SMARTLOCK_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
spring.datasource.username=${SMARTLOCK_DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${SMARTLOCK_DB_PASSWORD:${DB_PASSWORD:}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration. New Level 3 tables/columns are additive; back up before any schema change.
spring.jpa.hibernate.ddl-auto=${SMARTLOCK_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MQTT Configuration (docs/DEVICE_CONTRACT.md). ssl://host:8883 for TLS; tcp:// only on a private network.
mqtt.broker.url=${SMARTLOCK_MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${SMARTLOCK_MQTT_CLIENT_ID:spring-boot-server}
smartlock.mqtt.username=${SMARTLOCK_MQTT_USERNAME:}
smartlock.mqtt.password=${SMARTLOCK_MQTT_PASSWORD:}
smartlock.mqtt.ca-file=${SMARTLOCK_MQTT_CA_FILE:}
smartlock.mqtt.topic-prefix=${SMARTLOCK_MQTT_TOPIC_PREFIX:smartlock}

# Door node. Configure only the SHA-256 of the device token; the token itself stays in firmware config.h.
smartlock.device.id=${SMARTLOCK_DEVICE_ID:door-01}
smartlock.device.token-sha256=${SMARTLOCK_DEVICE_TOKEN_SHA256:}
smartlock.device.request-window=${SMARTLOCK_DEVICE_REQUEST_WINDOW:120s}
smartlock.device.stale-after=${SMARTLOCK_DEVICE_STALE_AFTER:180s}
smartlock.command.unlock-ttl=${SMARTLOCK_COMMAND_UNLOCK_TTL:15s}
smartlock.command.lockdown-ttl=${SMARTLOCK_COMMAND_LOCKDOWN_TTL:60s}
smartlock.command.unlock-ms=${SMARTLOCK_COMMAND_UNLOCK_MS:7000}
smartlock.command.ack-grace=${SMARTLOCK_COMMAND_ACK_GRACE:5s}

# AI service on a private network (never published).
smartlock.ai.base-url=${SMARTLOCK_AI_URL:http://localhost:8000/api/}
smartlock.ai.connect-timeout=${SMARTLOCK_AI_CONNECT_TIMEOUT:3s}
smartlock.ai.read-timeout=${SMARTLOCK_AI_READ_TIMEOUT:20s}

# Persistent volume for alert photos in deployment.
smartlock.storage.alerts-dir=${SMARTLOCK_ALERTS_DIR:uploads/alerts}

# "native" only behind the trusted reverse proxy, so rate limits see the client IP instead of the proxy.
server.forward-headers-strategy=${SMARTLOCK_FORWARD_HEADERS:none}

# Local development and LAN access
server.address=${SMARTLOCK_BIND_ADDRESS:0.0.0.0}
server.servlet.session.timeout=30m
smartlock.admin.idle-timeout=${SMARTLOCK_ADMIN_IDLE_TIMEOUT:15m}
smartlock.admin.absolute-timeout=${SMARTLOCK_ADMIN_ABSOLUTE_TIMEOUT:4h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SMARTLOCK_SECURE_COOKIE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
smartlock.admin.username=${SMARTLOCK_ADMIN_USERNAME:}
smartlock.admin.password=${SMARTLOCK_ADMIN_PASSWORD:}
smartlock.mqtt.enabled=${SMARTLOCK_MQTT_ENABLED:true}

# Opt-in after a database backup; clears legacy plaintext PINs. See phase 2 handover.
smartlock.pin.migrate-legacy=${SMARTLOCK_MIGRATE_LEGACY_PINS:false}
