# Server Port
server.port=8080

# Optional per-machine settings; this file is not committed.
spring.config.import=optional:file:./config/application-local.properties

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${SMARTLOCK_DB_HOST:localhost}:${SMARTLOCK_DB_PORT:3306}/${SMARTLOCK_DB_NAME:btl_iot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SMARTLOCK_DB_USER:root}
spring.datasource.password=${SMARTLOCK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MQTT Configuration
mqtt.broker.url=${SMARTLOCK_MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=spring-boot-server
mqtt.topic.sub=iot/lock/events
mqtt.topic.pub=iot/lock/commands

# Local development only. Use HTTPS and enable secure cookies when deploying.
server.address=${SMARTLOCK_BIND_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SMARTLOCK_SECURE_COOKIE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
smartlock.admin.username=${SMARTLOCK_ADMIN_USERNAME:}
smartlock.admin.password=${SMARTLOCK_ADMIN_PASSWORD:}
smartlock.mqtt.enabled=${SMARTLOCK_MQTT_ENABLED:true}
