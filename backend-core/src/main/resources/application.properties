# Server Port
server.port=8080

# Load the shared environment file whether the app starts from the repository
# root or from the backend-core directory.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:btl_iot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=spring-boot-server
mqtt.topic.sub=iot/lock/events
mqtt.topic.pub=iot/lock/commands
